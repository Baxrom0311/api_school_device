services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # ==================== REDIS (Cache + Celery Broker) ====================
  redis:
    image: redis:7-alpine
    container_name: iot_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # ==================== EMQX MQTT BROKER ====================
  emqx:
    image: emqx/emqx:5.8.3
    container_name: iot_emqx
    restart: always
    ports:
      - '1883:1883' # MQTT TCP
      - '8083:8083' # MQTT WebSocket
      - '8084:8084' # MQTT WSS (Secure WebSocket)
      - '127.0.0.1:18083:18083' # EMQX Dashboard (localhost only)
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE:?EMQX_NODE_COOKIE env var is required}
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USERNAME:?EMQX_DASHBOARD_USERNAME env var is required}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD env var is required}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ['CMD', '/opt/emqx/bin/emqx', 'ctl', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # ==================== DJANGO WEB (API) ====================
  web:
    build:
      context: .
      dockerfile: deployments/compose/backend/Dockerfile
    container_name: iot_backend
    command: /start
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=true
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}@redis:6379/0
    restart: always
    volumes:
      - static_volume:/app/assets/staticfiles
      - media_volume:/app/assets/media
    ports:
      - ${PORT:-8001}:8000
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health/live")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - backend_network

  # ==================== MQTT LISTENER SERVICE ====================
  mqtt_listener:
    build:
      context: .
      dockerfile: deployments/compose/backend/Dockerfile
    container_name: iot_mqtt_listener
    command: /start-mqtt-listener
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=true
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}@redis:6379/0
    restart: always
    healthcheck:
      test: ['CMD', 'python', '-c', 'import django; django.setup(); from django.core.cache import cache; exit(0 if cache.get("mqtt_listener:alive") else 1)']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - backend_network

  # ==================== CELERY WORKER ====================
  celery_worker:
    build:
      context: .
      dockerfile: deployments/compose/backend/Dockerfile
    container_name: iot_celery_worker
    command: /start-celeryworker
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=true
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}@redis:6379/0
      - CELERY_CONCURRENCY=4
    restart: always
    healthcheck:
      test: ['CMD', 'celery', '-A', 'core', 'inspect', 'ping', '--timeout', '5']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network

  # ==================== CELERY BEAT (Scheduler) ====================
  celery_beat:
    build:
      context: .
      dockerfile: deployments/compose/backend/Dockerfile
    container_name: iot_celery_beat
    command: /start-celerybeat
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=true
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}@redis:6379/0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - backend_network

  # ==================== CELERY FLOWER (Monitoring) ====================
  celery_flower:
    build:
      context: .
      dockerfile: deployments/compose/backend/Dockerfile
    container_name: iot_celery_flower
    command: /start-flower
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=true
      - CELERY_BROKER=redis://:${REDIS_PASSWORD:-${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH env var is required}
    restart: always
    ports:
      - ${CELERY_FLOWER_PORT:-5555}:5555
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - backend_network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  backend_network:
    driver: bridge
