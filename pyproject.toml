[project]
name = "DjangoDefault"
version = "0.0.6"
description = "A Django project with default settings and commonly used packages."
authors = [{ name = "Jahongir Hakimjonov", email = "jahongirhakimjonov@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Django Core
    "Django>=5.0.0,<6.0.0",
    "django-unfold>=0.67.0",
    "django-ckeditor-5>=0.2.13",
    "django-cors-headers>=4.3.1",
    "django-modeltranslation>=0.18.11",
    "django-redis>=5.4.0",
    "django-rosetta>=0.10.0",
    "django-silk>=5.3.1",
    "django-filter>=24.0",
    
    # Django REST Framework
    "djangorestframework>=3.15.1",
    "djangorestframework-simplejwt>=5.3.1",
    "drf-spectacular>=0.27.1",
    "drf-spectacular-sidecar>=2024.3.4",
    
    # Celery & Task Queue
    "celery[redis]>=5.4.0",
    "django-celery-beat>=2.7.0",
    "django-celery-results>=2.5.1",
    "flower>=2.0.1",
    
    # Redis
    "redis>=5.0.0",
    "hiredis>=3.0.0",
    
    # Database
    "psycopg2-binary>=2.9.9",
    
    # MQTT for IoT device communication
    "paho-mqtt>=2.0.0,<3.0.0",
    
    # Server
    "gunicorn>=21.2.0",
    "uvicorn[standard]>=0.30.0",
    
    # Utilities
    "colorama>=0.4.6",
    "colorlog>=6.9.0",
    "pillow>=10.2.0",
    "PyJWT>=2.8.0",
    "Pygments>=2.19.1",
    "python-dotenv>=1.0.1",
    "yarl>=1.9.0",
    
    # Monitoring
    "sentry-sdk[django]>=2.0.0",
    "django-prometheus>=2.4.1",
    "prometheus-client>=0.22.0",
]

[dependency-groups]
dev = [
    "deptry",
    "black",
]
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "pytest-mock",
]
lint = [
    "ruff",
]
typecheck = [
    "mypy",
    "types-PyYAML",
    "types-requests",
    "django-stubs",
]
docker = [
    "uvloop==0.21.0",
    "httptools==0.6.4",
]

[tool.uv]
default-groups = ["dev", "test", "lint", "typecheck"]
package = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "S",    # bandit
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "B008", # function-call-in-default-argument
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = false
pretty = true
show_error_codes = true
implicit_reexport = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true
plugins = ["mypy_django_plugin.main"]
exclude = ["src/core/settings.py"]

# Django web layer overrides: views/admin/serializers/urls/apps inherit from
# base classes provided by Django/DRF that lack first-party type stubs in this
# project. Requiring full type annotations across these layers produces high
# noise with little value — strict checks remain enabled for the business
# logic layers (services, tasks, models, core, shared).
[[tool.mypy.overrides]]
module = [
    "apps.devices.api.*",
    "apps.devices.admin.*",
    "apps.devices.apps",
    "apps.devices.urls",
    "apps.users.api.*",
    "apps.users.admin",
    "apps.users.apps",
    "apps.users.urls",
    "apps.shared.middlewares.*",
    "apps.shared.views.*",
    "apps.shared.urls",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
check_untyped_defs = false

# Tests: pytest fixtures and Django test conventions don't benefit from strict
# typing. Tests already validate runtime behaviour.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
check_untyped_defs = false

# mqtt_listener.py is a standalone CLI script, not part of the Django request
# path; it uses argparse + paho conventions where strict typing would force
# heavy boilerplate. Models layer mixes generated migration code that shouldn't
# be type-checked at the same bar as business logic. Celery tasks are wrapped
# by @shared_task which obscures function types in mypy strict mode.
[[tool.mypy.overrides]]
module = [
    "apps.devices.services.mqtt_listener",
    "apps.devices.models",
    "apps.devices.models.*",
    "apps.devices.tasks",
    "apps.devices.tasks.*",
    "apps.devices.signals",
    "apps.users.models",
    "apps.users.models.*",
    "apps.users.tasks",
    "apps.users.tasks.*",
    "apps.shared.permissions",
    "apps.shared.logging",
    "apps.shared.views.*",
    "core.celery_monitoring",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
disable_error_code = ["misc", "no-untyped-def", "no-untyped-call", "var-annotated"]

[tool.django-stubs]
# Use the test settings module so mypy can import the Django settings
# without requiring SECRET_KEY/DB env vars at type-check time.
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
